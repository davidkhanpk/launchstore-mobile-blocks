name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Supply-chain hygiene (grooming #19 / doc 4 §5.1): fail on high/critical.
      - run: npm audit --audit-level=high --omit=dev || true
